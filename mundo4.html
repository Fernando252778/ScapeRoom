  <a-entity id="comida" gltf-model="#comida" position="30.99 0.01 28.18" scale="11.55 10.30 11.28" rotation="0 -260 0" recoger-comida class="aframe-clickable"></a-entity>

  <a-entity id="gary" gltf-model="#gary" position="-15.44 -3.86 44.27" scale="1.05 0.64 0.99" rotation="0 -163.56 0" interactuar-gary class="aframe-clickable"></a-entity>

<script>

// =====================
// 
// =====================

let tieneComida = false;
let garyMovido = false;

AFRAME.registerComponent('recoger-comida', {
  init: function() {
    this.el.addEventListener('click', () => {
      if (!tieneComida) {
        tieneComida = true;
        this.el.setAttribute('visible', false);
        alert("¡Has recogido la comida de Gary!");
      }
    });
  }
});

AFRAME.registerComponent('interactuar-gary', {
  init: function() {
    this.el.addEventListener('click', () => {
      if (!tieneComida) {
        alert("Gary esta hambriento dale de comer, busca algo de comida en la cocina.");
        return;
      }
      if (!garyMovido) {
        garyMovido = true;
        alert("Gary huele la comida y va a comer...");
        this.el.setAttribute('animation__mover', {
          property: 'position',
          to: '-4.24 -4.21 42.39',
          dur: 3000,
          easing: 'linear'
        });
        this.el.removeAttribute('interactuar-gary');
      }
    });
  }
});

AFRAME.registerComponent('recoger-llave', {
  init: function() {
    this.el.addEventListener('click', () => {
      if (!garyMovido) {
        alert("Espera a que Gary vaya a su comida si no pensara que se la vas a quitar y te mordera");
        return;
      }
      this.el.setAttribute('visible', false);
      alert("¡Has recogido la llave del Crustáceo Cascarudo! dirijete al Crustáceo Cascarudo para robar la fórmula secreta y completar la misión");
    });
  }
});

// =====================
// COLISIONES 
// =====================

const rig = document.querySelector('#rig');
const sensor = document.querySelector('#sensor');

let lastValidPosition = new THREE.Vector3();

AFRAME.registerComponent('col-check',{
  tick:function(){
    const raycaster = sensor.components.raycaster;
    const currentPosition = rig.object3D.position;

    const movementDirection = new THREE.Vector3()
      .copy(currentPosition)
      .sub(lastValidPosition)
      .normalize();

    if(movementDirection.length()>0){
      sensor.setAttribute('raycaster','direction',movementDirection);

      if(raycaster.intersections.length>0){
        rig.object3D.position.copy(lastValidPosition);
      }else{
        lastValidPosition.copy(currentPosition);
      }
    } else {
      lastValidPosition.copy(currentPosition);
    }
  }
});

const mover1 = document.querySelector("#rig");
const teleport1 = document.querySelector("#teleport1");

// Posición 1 a la que quieres teletransportarte 
const destino1 = { x: 17.20172, y: 0, z: 31.15515};

teleport1.addEventListener("click", () => {
    mover1.setAttribute("position", destino1);
});

const mover2 = document.querySelector("#rig");
const teleport2 = document.querySelector("#teleport2");

// Posición 2 a la que quieres teletransportarte 
const destino2 = { x: -11, y: 0, z: 45};

teleport2.addEventListener("click", () => {
    mover2.setAttribute("position", destino2);
});

AFRAME.registerComponent('autotp', {
  init: function () {
    this.el.addEventListener('click', () => {
      window.location.href = "https://fernando252778.github.io/ScapeRoom/mundo2.html";
    });
  }
});

document.querySelector('#portal').setAttribute('autotp', '');

// ACTIVAR COLISIONES
document.querySelector('a-scene').setAttribute('col-check','');

</script>

</html>
