<html>
  <head>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-physics-system@4.0.1/dist/aframe-physics-system.min.js"></script>
    <script>
       AFRAME.registerComponent("mylink", {
        init: function () {
          this.el.addEventListener("click", () => {
            window.location = this.data.href;
          });
        },
      });

      AFRAME.registerComponent("glb-colisionable", {
        init: function () {
          this.el.addEventListener("model-loaded", () => {
            this.el.setAttribute("static-body", "shape: hull");
          });
        },
      });
    </script>
  </head>
  <body>
     <a-scene
      physics="gravity: -9.8"
      cursor="rayOrigin: mouse"
      raycaster="objects: .tocable"
    >
      <a-assets>
        <a-asset-item id="mundo-2" src="bikini.glb"></a-asset-item>
      </a-assets>
 <a-entity
        id="player"
        position="0 2 10"
        camera
        look-controls="pointerLockEnabled: true"
        wasd-controls="acceleration: 35"
        kinematic-body="radius: 0.45; enableSlopes: true; enableJumps: false"
      ></a-entity>

      <a-entity
        id="bikini-world"
        class="tocable"
        gltf-model="#mundo-2"
        glb-colisionable
        position="0 -2.10 0"
        scale="50 50 50"
        rotation="0 -260 0"
      ></a-entity>

      <a-plane
        class="tocable"
        position="20 1 -3.90"
        src="#imgSortida"
        rotation="0 -90 0"
        transparent="true"
        mylink="href: https://github.com/Fernando252778/XDDD/tree/main/Aframe;"
      ></a-plane>
    </a-scene>
  </body>
</html>
