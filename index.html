<html>
  <head>

<script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
<script src="https://unpkg.com/aframe-look-at-component@1.0.0/dist/aframe-look-at-component.min.js"></script>
<script src="https://cdn.rawgit.com/donmccurdy/aframe-extras/v3.8.6/dist/aframe-extras.min.js"></script>
<script src="https://agarci9inscastellet.github.io/scaperoom/js/scaperoom.js"></script>

<script>
AFRAME.registerComponent("mylink", {
  schema:{href:{type:"string"}},
  init:function(){
    this.el.addEventListener("click",()=>{
      window.location = this.data.href;
    });
  }
});
</script>

</head>

<body>

<a-scene cursor="rayOrigin: mouse">

<a-assets>
<a-asset-item id="bikini" src="escenarios/bikini.glb"></a-asset-item>
<a-asset-item id="bus" src="items/bus.glb"></a-asset-item>
<a-asset-item id="flecha" src="cosas/flecha.glb"></a-asset-item>
<a-asset-item id="estrella" src="personajes/patricio.glb"></a-asset-item>
<a-plane id="cr7" src="cosas/cr7.png"></a-plane>
</a-assets>


<!-- TEXTO 1 -->
<a-text
value="CLICK AL BUS PARA VIAJAR"
position="-9.25831 20.53317 46.17747"
rotation="7 150 0"
align="center"
color="#FF0000"
width="40"
look-at="[camera]"
animation="property: position; dir: alternate; dur:1500; easing:easeInOutSine; loop:true; to:-9.25831 11 46.17747">
</a-text>


<!-- TEXTO 2 -->
<a-text
value="CLICK AL BUS PARA VIAJAR"
position="2.69967 17.36307 -33.44805"
rotation="6 0 -82"
align="center"
color="#FF0000"
width="40"
look-at="[camera]"
animation="property: position; dir: alternate; dur:1500; easing:easeInOutSine; loop:true; to:2.69967 11 -33.44805">
</a-text>


<!-- ESCENARIO -->
<a-entity gltf-model="#bikini" position="0 -2 0" scale="50 50 50" rotation="0 -260 0"></a-entity>


<!-- BUSES -->
<a-entity gltf-model="#bus" position="-9.25831 -1.93 46.17" scale="0.7 0.7 0.7" rotation="0 151 0"></a-entity>

<a-entity gltf-model="#bus" position="2.23 -1.73 -34.45" scale="0.7 0.7 0.7" rotation="0 -38 0"></a-entity>


<!-- PERSONAJES -->
<a-entity gltf-model="#estrella" position="40 40 40" scale="5 5 5" look-at="[camera]"></a-entity>

<!-- FLECHA 1 -->
<a-entity
gltf-model="#flecha"
position="2.69967 3.36 -33.44"
scale="0.007 0.007 0.007"
rotation="6 0 -82"
animation="property: position; dir:alternate; dur:1500; easing:easeInOutSine; loop:true; to:2.69967 7 -33.44">
</a-entity>


<!-- FLECHA 2 -->
<a-entity
gltf-model="#flecha"
position="-9.25831 3.53 46.17"
scale="0.007 0.007 0.007"
rotation="6 66 -82"
animation="property: position; dir:alternate; dur:1500; easing:easeInOutSine; loop:true; to:-9.25831 7.53 46.17">
</a-entity>


<!-- PLANOS -->
<a-plane src="#cr7" position="-5 7 -19" rotation="0 21 0" width="50" height="50" material="side:double"></a-plane>

<a-plane src="#cr7" position="-19 6 -25" rotation="0 84 0" width="50" height="50" material="side:double"></a-plane>

<a-plane src="#cr7" position="3 15 -36" rotation="0 151 0" width="50" height="50" material="side:double"></a-plane>


</a-scene>

</body>
</html>
