<html>
  <head>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script>
      <html>
  <head>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script>
  AFRAME.registerComponent("mylink", {
        init: function () {
          this.el.addEventListener("click", () => {
            window.location = this.data.href;
          });
        },
      });
    </script>
     </head>
  <body>
    <a-scene cursor="rayOrigin: mouse" raycaster="objects: .tocable">
      <a-assets>
        <a-asset-item id="mundo-2" src="bikini.glb"></a-asset-item>
      </a-assets>
        <a-entity
        id="player"
        camera
        position="0 8 30"
        look-controls="pointerLockEnabled: true"
        wasd-controls="acceleration: 35"
      ></a-entity>

      <a-entity
        id="bikini-world"
        class="tocable"
        gltf-model="#mundo-2"
        position="0 -2.10 0"
        scale="50 50 50"
        rotation="0 -260 0"
      ></a-entity>

      <a-entity id="cubo-habitacion" position="0 25 0">
        <a-plane
          width="220"
          height="70"
          position="0 0 -110"
          material="color: #7cb6ff; opacity: 0.72; side: double"
        ></a-plane>
        <a-plane
          width="220"
          height="70"
          position="0 0 110"
          rotation="0 180 0"
          material="color: #7cb6ff; opacity: 0.72; side: double"
        ></a-plane>
        <a-plane
          width="220"
          height="70"
          position="-110 0 0"
          rotation="0 90 0"
          material="color: #7cb6ff; opacity: 0.72; side: double"
        ></a-plane>
        <a-plane
          width="220"
          height="70"
          position="110 0 0"
          rotation="0 -90 0"
          material="color: #7cb6ff; opacity: 0.72; side: double"
        ></a-plane>
        <a-plane
          width="220"
          height="220"
          position="0 35 0"
          rotation="90 0 0"
          material="color: #9cc9ff; opacity: 0.72; side: double"
        ></a-plane>
        <a-plane
          width="220"
          height="220"
          position="0 -35 0"
          rotation="-90 0 0"
          material="color: #9cc9ff; opacity: 0.72; side: double"
        ></a-plane>
      </a-entity>

      <a-plane
        class="tocable"
        position="20 1 -3.90"
        src="#imgSortida"
        rotation="0 -90 0"
        transparent="true"
        mylink="href: https://github.com/Fernando252778/XDDD/tree/main/Aframe;"
      ></a-plane>
    </a-scene>
  </body>
</html>
