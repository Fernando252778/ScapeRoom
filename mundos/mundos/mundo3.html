<html>
  <head>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script>
        AFRAME.registerComponent("mylink", {
        init: function() {  
         this.el.addEventListener("click", (e) => {              
            window.location = this.data.href;      
           })
        }
      })
    </script>
  </head>
  
  <body>
  <a-scene cursor="rayOrigin: mouse">

    <!--A-ssets-->
    <a-assets>
    <a-asset-item id="Casa" src="Escenarios/Casa-de-bob-esponja.glb"></a-asset-item>
    </a-assets>
  
    <!--A-entity-->
    <a-entity gltf-model=#Casa position="603.76581 -19.36935 297.44139" scale="1 1 1"></a-entity>

    
  
  <!--Movimiento de la camara-->
     <!--El wasd-controls es lo que nos ayuda a definir velocidad de la camara-->
      <a-entity 
        camera 
        position="0 1.6 0"
        wasd-controls="acceleration: 175" 
        look-controls>
      </a-entity> 

    <!--Luz de la esena-->>
    <a-entity light="type: ambient; color: #ffffff; intensity: 1.5"></a-entity>

<a-plane src="Cosas/techo.jpg" position="7.7507 8.93493 5.7738" rotation="89.0519653082082 0 0" width="100" height="100" material="side: double" geometry=""></a-plane>
  </body>
</html>
