<html>
  <head>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script>
        AFRAME.registerComponent("mylink", {
        init: function() {  
         this.el.addEventListener("click", (e) => {              
            window.location = this.data.href;      
           })
        }
      })
    </script>
  </head>
  
  <body>
  <a-scene cursor="rayOrigin: mouse">

    <!--A-ssets-->
    <a-assets>
    <a-asset-item id="Balde" src="Escenarios/Balde-carnada.glb"></a-asset-item>
    <a-asset-item id="plak" src="Personajes/plankton.glb"></a-asset-item>
    <a-asset-item id="Karen" src="Personajes/karenspongebob.glb"></a-asset-item>
   
  </a-assets>
  
    <!--A-entity-->
    <a-entity gltf-model=#Balde position="-6 -8.963 7" scale="1 1 1"></a-entity>
    <a-entity gltf-model=#plak position="-35.36754 -4.46664 7.648" scale="" rotation="0 89.56590845044055 0"></a-entity>  
    <a-entity gltf-model=#Karen position="-35.36754 -4.46664 7.648" scale="" rotation="0 89.56590845044055 0"></a-entity>  
    <a-entity gltf-model=#patricio position="-35.36754 -4.46664 7.648" scale="" rotation="0 89.56590845044055 0"></a-entity>  
    
    
  
  <!--Movimiento de la camara-->
     <!--El wasd-controls es lo que nos ayuda a definir velocidad de la camara-->
      <a-entity 
        camera 
        position="0 1.6 0"
        wasd-controls="acceleration: 175" 
        look-controls>
      </a-entity> 

  </body>
</html>
