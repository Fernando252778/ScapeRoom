<html>
  <head>
    <title>Mundo-5</title>
    <!--librerias-->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  </head>

  <body>
    <a-scene cursor="rayOrigin: mouse">

      <!--A-assets-->
      <a-assets>
        <a-asset-item id="Crus" src="escenarios/crustaceocascarudo.glb"></a-asset-item>
        <a-asset-item id="Caja" src="cosas/Caja-fuerte.glb"></a-asset-item>
        <a-asset-item id="Formula" src="items/botella.glb"></a-asset-item>
        <a-asset-item id="Don" src="personajes/Don-cangrejo.glb"></a-asset-item>
      </a-assets>
  
      <!--A-entitys-->
      <a-entity gltf-model="#Crus" position="-2965.462 118.97 -2070.02" scale="" rotation="0 -260 0"></a-entity>  
      <a-entity gltf-model="#Caja" position="59.1083 -0.76784 -17.4312" scale="0.08 -0.072 0.049" rotation="180.07 -1691.54 0"></a-entity>

      <!--Botella y Don-->
      <a-entity gltf-model="#Formula" position="56.00252 -0.94175 -19.88217" scale="1.24963 -1.51584 1.22716" rotation="180.07 -1691.54 0" class="clickable" coger-botella></a-entity>
      <a-entity gltf-model="#Don" position="37.71429 -6.1564 16.89543" scale="3.67159 -5.97148 3.77607" rotation="180.07 -1691.54 0" class="clickable" hablar-don></a-entity>


      <!--A-planes-->
      <a-plane src="cosas/Suelo.jpg" position="50.03742 -5.16909 -28.6942" rotation="-1.8466429737066434 8.352005779622012 88.00230662752854" width="100" height="100" material="side: double" scale="-0.31873 0.38664 0.86095"></a-plane>
      <a-plane src="cosas/Suelo.jpg" position="58.70772 -5.17295 -5.75182" rotation="1.1951899606428973 12.167904695193293 0.5402992008083662" width="100" height="100" material="side: double" scale="-0.3695 0.287 0.86095"></a-plane>
      <a-plane src="cosas/techo-2.jpg" position="56.33389 8.85107 -6.53982" rotation="-270 10.68 0" width="100" height="100" material="side: double" scale="-0.335 0.506 1.03"></a-plane>



<!--Scripts-->
  <script>
      // Componente don cangrejo
      AFRAME.registerComponent('hablar-don', {
        init: function() {
          this.el.addEventListener('click', () => {
            alert("Don: Bob esponja te ves un poco raro pero bueno eso ahorita no importa, mejor traeme el dinero de la caja fuerte para contar mis ganacias de la semana.");
          });
        }
      });

      // Componente de botella 
      AFRAME.registerComponent('coger-botella', {
        init: function() {
          this.el.addEventListener('click', () => {
            window.location.href = "mundo-6.html";
          });
        }
      });

      // Componente de viajes
      AFRAME.registerComponent("mylink", {
        init: function() {  
          this.el.addEventListener("click", (e) => {              
            window.location = this.data.href;      
          })
        }
      })
    </script>
    </a-scene>
  </body>
</html>
